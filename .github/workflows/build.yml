name: Build iPad app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Cache medical dictionary
        id: meddict
        uses: actions/cache@v4
        with:
          path: Sources/MedDict.sqlite
          key: meddict-mesh2026-${{ hashFiles('tools/build_meddict.py') }}

      - name: Build medical dictionary from NLM MeSH
        if: steps.meddict.outputs.cache-hit != 'true'
        run: |
          base=https://nlmpubs.nlm.nih.gov/projects/mesh/MESH_FILES/xmlmesh
          curl -fsSL --retry 3 -o desc.gz "$base/desc2026.gz"
          curl -fsSL --retry 3 -o supp.gz "$base/supp2026.gz"
          python3 tools/build_meddict.py desc.gz supp.gz Sources/MedDict.sqlite
          ls -lh Sources/MedDict.sqlite

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned — SideStore signs it on the iPad)
        run: |
          set -o pipefail
          xcodebuild \
            -project PdfCraftPad.xcodeproj \
            -target PdfCraftPad \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log || {
              grep -E "error:" build.log | sort -u | head -40 | sed 's/^/::error::/'
              exit 1
            }

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PdfCraftPad.app Payload/
          zip -qry PdfCraftPad.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: PdfCraftPad-ipa
          path: PdfCraftPad.ipa

      - name: Publish as the "latest" release (easy to download from the iPad)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PdfCraftPad.ipa \
            --title "PdfCraft Pad — build ${{ github.run_number }}" \
            --notes "Download PdfCraftPad.ipa on your iPad, then open it in SideStore." \
            --prerelease
